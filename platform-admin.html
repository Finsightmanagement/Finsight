<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSight • Product Access</title><style>
:root{--ink:#1b3339;--muted:#657c84;--line:#dde7e9;--accent:#097e7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.5 Inter,'Segoe UI',Arial,sans-serif;background:#f4f7f8;color:var(--ink)}.wrap{max-width:1080px;margin:48px auto;padding:0 22px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 9px 35px #163a3a08}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}h1{font-size:25px;margin:0}p{color:var(--muted)}label{font-weight:600;display:block;margin:11px 0 5px}input{padding:12px;width:100%;border:1px solid #cddadd;border-radius:10px;font:inherit}button{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}.hint{font-size:12px;color:var(--muted)}.notice{margin:14px 0;padding:12px;border-radius:10px;background:#e6f5f2;color:#096e68}.notice.error{background:#feece8;color:#a33b31}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.company{border:1px solid var(--line);padding:16px;border-radius:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.on{color:#137946}.off{color:#a76220}.mono{font-family:monospace;font-size:11px;color:var(--muted)}@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{margin:15px auto}}
</style></head><body><div class="wrap"><div class="top"><div><h1>FinSight • Product Access</h1><p style="margin:2px 0">Platform administration</p></div><div id="account"></div></div><div id="content" class="card">Loading...</div></div>
<script>
'use strict';const SB_URL='https://kwyvytwyhslhmdqtfrkf.supabase.co';const SB_KEY='sb_publishable_jEMjFFLw8D3DfbCdtD7fGg_cxKK9SbR';let client=null,logged=false,rows=[],busy=false;
const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(m,err=false){const existing=el('notice');if(existing)existing.remove();const n=document.createElement('div');n.id='notice';n.className='notice'+(err?' error':'');n.textContent=m;el('content').prepend(n)}
function login(){el('account').innerHTML='';el('content').innerHTML='<h2>Platform Admin Login</h2><p>Use the existing FinSight platform administrator email and password.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><p><button class="primary" onclick="signIn()">Sign in</button></p>'}
async function signIn(){if(busy)return;busy=true;try{const email=el('email').value.trim(),password=el('password').value;const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await load()}catch(e){note(e.message,true)}finally{busy=false}}
async function signOut(){await client.auth.signOut();logged=false;login()}
async function load(){let {data:{user}}=await client.auth.getUser();if(!user){login();return}try{const {data,error}=await client.rpc('finsight_platform_pos_access',{p_action:'list',p_company:null,p_enabled:null});if(error)throw error;rows=Array.isArray(data)?data:[];logged=true;render()}catch(e){el('content').innerHTML='<h2>Access restricted</h2><p>Only a registered FinSight platform administrator can view or change company POS subscriptions.</p><button onclick="signOut()">Sign out</button>';note(e.message,true)}}
function render(){el('account').innerHTML='<button onclick="signOut()">Sign out</button>';el('content').innerHTML='<div class="row"><div><h2 style="margin:0">Companies</h2><p class="hint">POS access is controlled independently for each company. Accounting registration is shown for reference; the existing Accounting access system is not modified here.</p></div><button onclick="load()">Refresh</button></div><div class="grid">'+rows.map(r=>'<div class="company"><strong>'+esc(r.name)+'</strong><div class="mono">'+esc(r.id)+'</div><div class="row" style="margin-top:18px"><span>Accounting registration</span><strong class="'+(r.accounting_registered?'on':'off')+'">'+(r.accounting_registered?'Registered':'No active members')+'</strong></div><div class="row" style="margin-top:12px"><span>FinSight POS</span><strong class="'+(r.pos_enabled?'on':'off')+'">'+(r.pos_enabled?'Enabled':'Disabled')+'</strong></div><p style="margin:14px 0 0"><button '+(busy?'disabled':'')+' class="'+(!r.pos_enabled?'primary':'')+'" onclick="setAccess(\''+esc(r.id)+'\','+!r.pos_enabled+')">'+(r.pos_enabled?'Suspend POS':'Enable POS')+'</button></p></div>').join('')+'</div>'}
async function setAccess(company,enabled){if(busy)return;busy=true;try{const {error}=await client.rpc('finsight_platform_pos_access',{p_action:'set_pos',p_company:company,p_enabled:enabled});if(error)throw error;await load();note('POS access '+(enabled?'enabled':'suspended')+' for the selected company.')}catch(e){note(e.message,true)}finally{busy=false}}
function script(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(Error('Unable to load POS authentication library'));document.head.appendChild(s)})}
async function boot(){try{if(!window.supabase?.createClient){try{await script('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js')}catch{await script('https://unpkg.com/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js')}}client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});await load()}catch(e){el('content').textContent='Connection problem: '+e.message}}
boot();
</script></body></html>
