<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSight • Super Admin</title>
<style>
:root{--ink:#193238;--muted:#687f86;--line:#dce7e8;--accent:#087e79;--bg:#f4f7f8;--red:#ab413b;--ok:#0e7c50}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:35px auto;padding:0 20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:23px;flex-wrap:wrap}
h1{font-size:27px;margin:0}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:0 0 12px}p{color:var(--muted);margin:6px 0 14px}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 15px;font:inherit;font-weight:650;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:var(--red)}button.small{padding:7px 11px;font-size:13px}
button:disabled{opacity:.5;cursor:wait}.card{border:1px solid var(--line);background:white;border-radius:17px;padding:23px;box-shadow:0 8px 25px #17383a0a;margin-bottom:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}.company{border:1px solid var(--line);border-radius:14px;padding:19px;background:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.on{color:var(--ok)}.off{color:#a66329}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.mono{font:11px monospace;color:var(--muted);overflow-wrap:anywhere}
.product{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #edf1f1}
.product:last-child{border:0}.tag{padding:4px 9px;border-radius:18px;font-size:12px;font-weight:650;background:#e9f4ed;color:var(--ok)}
.tag.off{background:#f9eee5;color:#9a6233}.tag.planned{background:#eff2f4;color:var(--muted)}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select{border:1px solid #cfdcde;border-radius:10px;padding:11px;width:100%;font:inherit;color:var(--ink);background:white}
input[type=checkbox]{width:auto;accent-color:var(--accent);margin-right:8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.checkrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.notice{padding:13px 16px;border-radius:11px;background:#e4f6ed;color:#136a4b;margin-bottom:17px}
.notice.error{background:#ffebe7;color:#a33b31}.overlay{position:fixed;inset:0;background:#14272b80;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.dialog{background:white;border-radius:19px;width:min(550px,100%);max-height:94vh;overflow-y:auto;padding:24px}
.dialog .actions{margin-top:18px;justify-content:flex-end}.members{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.member{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #edf1f1;padding:10px 0;flex-wrap:wrap}
.member:first-child{border-top:0}.summary{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:18px}
.summary .stat{background:white;border:1px solid var(--line);border-radius:12px;padding:13px 18px;min-width:130px}
.stat strong{display:block;font-size:23px}.search{width:min(350px,100%)}.hidden{display:none!important}
@media(max-width:620px){.fields{grid-template-columns:1fr}.wrap{margin:17px auto}.company{padding:14px}h1{font-size:23px}}
</style></head>
<body><div class="wrap"><header class="top"><div><h1>FinSight • Super Admin</h1><p>Company & Product Administration</p></div><div id="account"></div></header>
<div id="notice" class="hidden" role="status"></div>
<div id="content" class="card">Connecting to FinSight...</div></div><div id="modal"></div>
<script>
'use strict';
const SB_URL='https://kwyvytwyhslhmdqtfrkf.supabase.co';
const SB_KEY='sb_publishable_jEMjFFLw8D3DfbCdtD7fGg_cxKK9SbR';
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let client,user=null,companies=[],busy=false,expanded=new Set(),term='';
function notify(message,error=false){const n=el('notice');n.textContent=String(message);n.className='notice'+(error?' error':'');}
function dismiss(){el('notice').className='hidden'}
function login(){
 user=null;el('account').innerHTML='';
 el('content').innerHTML='<h2>FinSight Super Admin Login</h2><p>Use your authorized FinSight platform administrator account.</p><form id="loginForm" onsubmit="event.preventDefault();signIn()"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button class="primary" type="submit">Sign in</button></p></form>';
}
async function signIn(){
 if(busy)return;busy=true;dismiss();
 try{const email=el('email').value.trim(),password=el('password').value;
  const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await load();
 }catch(e){notify(e.message,true)}finally{busy=false}
}
async function signOut(){if(client)await client.auth.signOut();companies=[];user=null;closeDialog();dismiss();login()}
async function api(action,company=null,data={}){
 const {data:result,error}=await client.rpc('finsight_platform_company_admin',{p_action:action,p_company:company,p_data:data});
 if(error)throw error;return result;
}
async function load(){
 const {data:{user:logged},error}=await client.auth.getUser();
 if(error||!logged){login();return}
 user=logged;
 try{
  companies=await api('list');if(!Array.isArray(companies))companies=[];
  el('account').innerHTML='<span class="tiny">'+esc(user.email)+'</span> <button class="small" onclick="signOut()">Sign out</button>';
  dismiss();render();
 }catch(e){
  el('account').innerHTML='';
  el('content').innerHTML='<h2>Access restricted</h2><p>Signed in as <strong>'+esc(user.email||'Unknown account')+'</strong></p><p>Only FinSight platform administrators can manage company subscriptions.</p><button class="primary" onclick="signOut()">Switch account</button>';
  notify(e.message,true);
 }
}
function render(){
 const showing=companies.filter(matchCompany);
 const count=key=>companies.filter(c=>c[key]).length;
 el('content').innerHTML=
 '<div class="row"><div><h2>Companies</h2><p>Manage registration, staff access and products.</p></div><div class="actions"><button onclick="load()">Refresh</button><button class="primary" onclick="newCompany()">+ Add Company</button></div></div>'+
 '<div class="summary"><div class="stat"><strong>'+companies.length+'</strong><span class="tiny">Companies</span></div><div class="stat"><strong>'+count('accounting_enabled')+'</strong><span class="tiny">Accounting enabled</span></div><div class="stat"><strong>'+count('pos_enabled')+'</strong><span class="tiny">POS enabled</span></div></div>'+
 '<input class="search" aria-label="Search companies" placeholder="Search companies" value="'+esc(term)+'" oninput="term=this.value;filterCompanies()">'+
 '<div id="companyGrid" class="grid" style="margin-top:17px">'+showing.map(companyCard).join('')+'</div>';
}
function matchCompany(c){return [c.name,c.country,...(c.owners||[]).map(o=>o.email)].join(' ').toLowerCase().includes(term.toLowerCase())}
function filterCompanies(){const grid=el('companyGrid');if(grid)grid.innerHTML=companies.filter(matchCompany).map(companyCard).join('')}
function companyCard(c){
 const id=esc(c.id);
 const ownerNames=(c.owners||[]).map(o=>esc(o.email)).join(', ');
 return '<article class="company"><div class="row"><div><h3 style="margin:0">'+esc(c.name)+'</h3><div class="tiny">'+esc(c.country||'')+' · '+esc(c.currency||'KES')+'</div></div><button class="small" onclick="editCompany(\''+id+'\')">Edit</button></div>'+
 '<div class="mono">'+id+'</div>'+
 productRow(c,'Accounting','accounting_enabled')+
 productRow(c,'POS','pos_enabled')+
 '<div class="product"><strong>HR</strong><span class="tag planned">Coming later</span></div>'+
 '<div class="members"><div class="row"><strong>Company Users ('+(c.members||[]).length+')</strong><button class="small" onclick="toggleUsers(\''+id+'\')">'+(expanded.has(c.id)?'Hide':'Manage Users')+'</button></div>'+
 (expanded.has(c.id)?memberPanel(c):'<p class="tiny">'+(ownerNames||'No owner assigned')+'</p>')+
 '</div></article>';
}
function productRow(c,product,key){
 const enabled=!!c[key],id=esc(c.id);
 return '<div class="product"><strong>'+product+'</strong><div class="actions"><span class="tag '+(enabled?'':'off')+'">'+(enabled?'Enabled':'Disabled')+'</span>'+
 '<button class="small '+(enabled?'danger':'')+'" onclick="setProduct(\''+id+'\',\''+product+'\','+(!enabled)+')">'+(enabled?'Disable':'Enable')+'</button></div></div>';
}
function memberPanel(c){
 const id=esc(c.id);
 return '<div><div class="members-list">'+(c.members||[]).map(m=>
 '<div class="member"><div><strong>'+esc(m.email)+'</strong><div class="tiny">'+esc(m.role)+' · '+(m.active?'Active':'Disabled')+'</div></div>'+
 '<button class="small '+(m.active?'danger':'')+'" onclick="setMember(\''+id+'\',\''+esc(m.id)+'\','+(!m.active)+')">'+(m.active?'Disable':'Activate')+'</button></div>'
 ).join('')+'</div><button class="primary small" onclick="addMember(\''+id+'\')">+ Assign User</button></div>';
}
function toggleUsers(id){if(expanded.has(id))expanded.delete(id);else expanded.add(id);filterCompanies()}
function modal(title,fields,submitLabel,callback){
 el('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeDialog()"><div class="dialog" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2>'+
 '<form id="editForm"><div>'+fields+'</div><div class="actions"><button type="button" onclick="closeDialog()">Cancel</button><button id="submitForm" type="submit" class="primary">'+esc(submitLabel)+'</button></div></form></div></div>';
 el('editForm').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;busy=true;dismiss();
  const b=el('submitForm');b.disabled=true;
  try{const data=Object.fromEntries(new FormData(e.target));await callback(data);closeDialog();await load();notify('Company administration saved.')}
  catch(err){notify(err.message,true)}
  finally{busy=false;if(b&&b.isConnected)b.disabled=false}
 });
}
function closeDialog(){el('modal').innerHTML=''}
function newCompany(){
 const fields=[
 '<label>Company name</label><input name="name" maxlength="120" required placeholder="Company legal or trading name">',
 '<div class="fields"><div><label>Country</label><input name="country" value="Kenya" required></div>',
 '<div><label>Currency</label><input name="currency" value="KES" maxlength="3" required></div></div>',
 '<label>Owner email (optional)</label><input name="owner_email" type="email" autocomplete="off" placeholder="Existing registered FinSight user">',
 '<p class="tiny">If the owner is not registered, leave blank and assign their account after registration.</p>',
 '<div class="checkrow"><label><input name="accounting_enabled" type="checkbox" checked>FinSight Accounting</label>',
 '<label><input name="pos_enabled" type="checkbox">FinSight POS</label></div>'
 ].join('');
 modal('Add Company',fields,'Create Company',async d=>{
  await api('create',null,{name:d.name,country:d.country,currency:d.currency,owner_email:d.owner_email||null,
    accounting_enabled:!!el('editForm').querySelector('[name=accounting_enabled]').checked,
    pos_enabled:!!el('editForm').querySelector('[name=pos_enabled]').checked});
 });
}
function editCompany(id){
 const c=companies.find(c=>c.id===id);if(!c)return;
 const fields=[
 '<label>Company name</label><input name="name" value="'+esc(c.name)+'" maxlength="120" required>',
 '<div class="fields"><div><label>Country</label><input name="country" value="'+esc(c.country||'Kenya')+'" required></div>',
 '<div><label>Currency</label><input name="currency" value="'+esc(c.currency||'KES')+'" maxlength="3" required></div></div>'
 ].join('');
 modal('Edit Company',fields,'Save Changes',d=>api('edit',id,d));
}
function addMember(id){
 const c=companies.find(c=>c.id===id);if(!c)return;
 const fields=[
 '<label>Registered user email</label><input name="email" type="email" required placeholder="person@example.com">',
 '<label>Company role</label><select name="role">',
 '<option value="owner">Owner</option><option value="admin">Admin</option><option value="accountant">Accountant</option>',
 '<option value="manager">Manager</option><option value="viewer">Viewer</option><option value="clerk">Clerk</option></select>',
 '<p class="tiny">The user must already have a FinSight account. This does not send an invitation.</p>'
 ].join('');
 modal('Assign User · '+c.name,fields,'Assign User',d=>api('assign_member',id,d));
}
async function runChange(action,company,data,message){
 if(busy)return;busy=true;dismiss();
 try{await api(action,company,data);await load();notify(message)}
 catch(e){notify(e.message,true)}finally{busy=false}
}
function setProduct(company,product,enabled){
 const c=companies.find(x=>x.id===company);if(!c)return;
 const msg=enabled?'Enable '+product+' for '+c.name+'?':'Disable '+product+' for '+c.name+'? Existing records will be retained, but access will be restricted.';
 if(!confirm(msg))return;
 runChange('set_product',company,{product,enabled},product+' '+(enabled?'enabled':'disabled')+' for '+c.name);
}
function setMember(company,membership_id,active){
 if(!confirm((active?'Reactivate':'Disable')+' this company user?'))return;
 runChange('set_member_active',company,{membership_id,active},'Company user access updated.');
}
function script(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('Supabase connection library unavailable'));document.head.appendChild(s)})}
async function boot(){
 try{
  if(!window.supabase?.createClient){
   try{await script('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js')}
   catch{await script('https://unpkg.com/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js')}
  }
  client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  await load();
 }catch(e){el('content').textContent='Connection error: '+e.message}
}
boot();
</script></body></html>
