async function enterEmployee(){
 if(S.busy)return;
 const id=document.getElementById('chosenEmployee')?.value,pin=document.getElementById('employeePin')?.value;
 if(!id||!pin)return show('Select your name and enter the PIN.','error');
 S.busy=true;
 try{
  const result=await rpc('pos_cashier_login',{p_company:S.ws.company_id,p_outlet:S.ws.outlet_id,p_cashier:id,p_pin:pin});
  if(!result?.success||result.role!==S.selection)throw new Error('PIN or role is incorrect.');
  S.role=result.role;S.token=result.token;S.employee={id:result.cashier_id,name:result.name,role:result.role};
  S.notice='';S.page=S.role==='Admin'?'management':S.role==='Kitchen'?'kitchen':'checkout';
  S.orders=[];S.menu=[];S.tables=[];S.setup=null;S.employees=[];S.reports=[];S.tillSummary=null;S.paymentMethods=[];S.shiftDetail=null;
  clearCache();render();setRefresh();
  const work=loadPage(S.page,true);
  const wsWork=S.role==='Cashier'?refreshWorkspace():Promise.resolve();
  void Promise.allSettled([work,wsWork]).then(()=>{if(S.token===result.token&&S.role!=='Kitchen')render()});
 }catch(e){const field=document.getElementById('employeePin');if(field)field.value='';show(e.message,'error')}
 finally{S.busy=false}
}
async function refreshWorkspace(){if(!S.ws)return;const original=S.ws.outlet_id,identity=S.token;const w=await rpc('pos_my_workspaces');if(!S.ws||S.ws.outlet_id!==original||S.token!==identity)return;S.ws=(w||[]).find(x=>x.outlet_id===original)||S.ws}
function setRefresh(){
 clearInterval(S.timer);S.timer=null;
 if(S.liveChannel){S.db.removeChannel(S.liveChannel);S.liveChannel=null}
 if(S.role!=='Kitchen')return;
 let busy=false,debounce=null;
 const refresh=async()=>{
  if(S.role!=='Kitchen'||S.page!=='kitchen'||busy||document.hidden)return;
  busy=true;
  try{
   const before=JSON.stringify(S.orders);
   await loadKitchen();stamp('kitchen');
   if(before!==JSON.stringify(S.orders)&&!document.activeElement?.matches('input,textarea,select'))render();
  }catch(e){console.warn('Kitchen refresh:',e.message)}finally{busy=false}
 };
 const notify=()=>{if(debounce)clearTimeout(debounce);debounce=setTimeout(refresh,75)};
 S.liveChannel=S.db.channel('pos-kitchen-'+S.ws.outlet_id)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'pos_kitchen_notifications',filter:'outlet_id=eq.'+S.ws.outlet_id},notify)
  .subscribe(status=>{if(status==='CHANNEL_ERROR')console.warn('Kitchen Realtime disconnected; fallback remains active')});
 S.timer=setInterval(refresh,15000);
}

async function go(page){
 const allowed=S.role==='Admin'?['management','reports','receipt','integrations']:S.role==='Kitchen'?['kitchen']:['checkout','history','tables','shift'];
 if(!allowed.includes(page))return;
 S.page=page;S.notice='';render();
 void loadPage(page,false);
}
async function loadPage(page,force=false){
 if(!S.ws||!S.role||!S.token)return;
 if(!force&&validCache(page))return;
 if(CACHE.inflight.has(page))return CACHE.inflight.get(page);
 const role=S.role,token=S.token,epoch=CACHE.epoch;
 const work=(async()=>{
  try{
   if(page==='management')await loadAdmin();
   else if(page==='reports')await loadReports();
   else if(page==='receipt')await loadReceipt();
   else if(page==='integrations')await loadIntegrations();
   else if(page==='kitchen')await loadKitchen();
   else if(page==='history')await loadHistory();
   else if(page==='tables')await loadTables();
   else if(page==='shift')await Promise.all([refreshWorkspace(),loadTillSummary()]);
   else if(page==='checkout')await loadCashier();
   if(S.role!==role||S.token!==token||CACHE.epoch!==epoch)return;
   stamp(page);
   if(S.page===page)render();
  }catch(e){
   if(S.role===role&&S.token===token){S.notice=e.message;S.noticeType='error';if(S.page===page)render()}
  }finally{CACHE.inflight.delete(page)}
 })();
 CACHE.inflight.set(page,work);return work;
}

function reports(){const shifts=S.reports.filter(r=>!S.reportDate||localDay(r.opened_at)===S.reportDate);if(S.selectedShift&&S.shiftDetail)return reportDetail();return `<div class="card"><div class="row"><div class="field"><label>Filter by date</label><input type="date" value="${esc(S.reportDate)}" onchange="S.reportDate=this.value;render()"></div><div class="actions">${b('All Dates',"S.reportDate='';render()")}${b('Refresh',"go('reports')")}</div></div><div class="reportscroll"><table class="report-table"><thead><tr><th>Date</th><th>Shift</th><th>Status</th><th>Review</th><th>Orders</th><th>Sales</th><th></th></tr></thead><tbody>${shifts.map(r=>`<tr><td>${esc(when(r.opened_at))}</td><td>${esc(String(r.id).slice(0,8))}</td><td>${esc(r.status)}</td><td>${esc(r.review)}</td><td>${Number(r.orders)}</td><td>${money(r.order_total)}</td><td>${b('View Report',`viewShift('${esc(r.id)}')`,'small')}</td></tr>`).join('')||'<tr><td colspan="7">No shifts found.</td></tr>'}</tbody></table></div></div>`}
function reportRows(){return (S.shiftDetail?.orders||[]).flatMap(order=>(order.items||[]).map(item=>({date:when(order.date),order:order.order_id?.slice(0,8)||'',item:item.item,quantity:item.quantity,gross:item.revenue_before_discount,discount:item.discount,net:item.revenue_after_discount,payment:order.payment_types,cashier:order.cashier,status:order.payment_status}))) }
function reportDetail(){const d=S.shiftDetail,rows=reportRows(),shift=S.reports.find(r=>r.id===S.selectedShift),recon=S.reconInfo||{status:'Not Submitted',lines:[]};
 const orders=d.orders||[],payments=d.payments||[];
 const gross=orders.reduce((s,o)=>s+Number(o.gross_amount??o.order_total??0),0);
 const discount=orders.reduce((s,o)=>s+Number(o.discount_amount||0),0),surcharge=orders.reduce((s,o)=>s+Number(o.surcharge_amount||0),0);
 const collections=payments.reduce((s,p)=>s+Number(p.amount||0),0);
 const reviewable=['Closed','Submitted','Returned'].includes(shift?.status);
 return `<div class="report-page"><div class="row" style="margin-bottom:15px">${b('← All Shifts','closeShiftDetail()')}<div class="actions">${b('Export Excel','exportShiftExcel()','primary')}${b('Print / Save PDF','printShiftReport()')}</div></div>
 <div class="card"><h2>Detailed Till Shift Report</h2><div class="hint">${esc(d.company_name)} · ${esc(d.outlet_name)} · ${esc(String(d.id).slice(0,8))}</div>
 <div class="hint">Business Date: ${esc(d.business_date||localDay(d.opened_at))} · Opened ${esc(when(d.opened_at))} · Closed ${esc(when(d.closed_at))}</div>
 <div class="report-summary"><div><div class="hint">Revenue Before Discount</div><h3>${money(gross)}</h3></div><div><div class="hint">Discounts / Surcharges</div><h3>−${money(discount)} / +${money(surcharge)}</h3></div><div><div class="hint">Net Order Revenue</div><h3>${money(gross-discount+surcharge)}</h3></div><div><div class="hint">Collections Received</div><h3>${money(collections)}</h3></div></div>
 <h3>Sales Items</h3><div class="reportscroll"><table class="report-table"><thead><tr><th>Date</th><th>Order</th><th>Item</th><th>Qty</th><th>Before Discount</th><th>Discount</th><th>After Discount</th><th>Payment Type(s)</th><th>Order Cashier</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.order)}</td><td>${esc(r.item)}</td><td>${Number(r.quantity)}</td><td>${money(r.gross)}</td><td>${money(r.discount||0)}</td><td>${money(r.net||0)}</td><td>${esc(r.payment)}</td><td>${esc(r.cashier)}</td></tr>`).join('')||'<tr><td colspan="9">No items found.</td></tr>'}</tbody></table></div>
 <h3 style="margin-top:25px">Payment Collections</h3><div class="reportscroll"><table class="report-table"><thead><tr><th>Received At</th><th>Order</th><th>Payment Type</th><th>Amount</th><th>Receiving Cashier</th><th>Reference</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${esc(when(p.collected_at))}</td><td>${esc(String(p.order_id||'').slice(0,8))}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${esc(p.receiver)}</td><td>${esc(p.reference||'')}</td></tr>`).join('')||'<tr><td colspan="6">No payments recorded.</td></tr>'}</tbody></table></div>
 <h3 style="margin-top:25px">Reconciliation — ${esc(recon.status)}</h3>
 ${recon.lines?.length?`<div class="reportscroll"><table class="report-table"><thead><tr><th>Payment Type</th><th>Expected</th><th>Actual</th><th>Variance</th><th>Explanation</th></tr></thead><tbody>${recon.lines.map(x=>`<tr><td>${esc(x.payment_type)}</td><td>${money(x.expected)}</td><td>${money(x.actual)}</td><td>${money(x.variance)}</td><td>${esc(x.explanation||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Cashier reconciliation has not been submitted.</p>'}
 ${recon.status==='Submitted'?`<div class="field" style="margin-top:12px"><label>Review note (required when returning)</label><textarea id="reviewReconNote">${esc(recon.note||'')}</textarea></div><div class="actions">${b('Approve Reconciliation',"reviewReconciliation('approve')",'primary')}${b('Return for Correction',"reviewReconciliation('return')")}</div>`:''}
 <div class="actions" style="margin-top:18px">${reviewable?`${b('Accept',"reviewShift('Accepted')")}${b('Approve Shift',"reviewShift('Approved')",'primary')}${b('Discard',"S.discardOpen=!S.discardOpen;render()",'danger')}`:''}</div>
 ${S.discardOpen?`<div class="field"><label>Discard reason</label><textarea id="discardReason"></textarea></div>${b('Confirm Discard',"reviewShift('Discarded')",'danger')}`:''}
 <p class="hint">Shift approval requires an approved reconciliation. Approval does not post into Accounting.</p></div></div>`;
}
function xmlEscape(text){return String(text??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function downloadBlob(blob,name){const uri=globalThis.URL.createObjectURL(blob);const a=document.createElement('a');a.href=uri;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>globalThis.URL.revokeObjectURL(uri),3000)}
function exportShiftExcel(){if(!S.shiftDetail)return;const rows=reportRows(),payments=S.shiftDetail.payments||[];
 const items=[['Date','Order','Item','Quantity','Revenue Before Discount','Discount','Revenue After Discount','Payment Type','Order Cashier'],...rows.map(r=>[r.date,r.order,r.item,r.quantity,Number(r.gross),Number(r.discount||0),Number(r.net||0),r.payment,r.cashier])];
 const collected=[['Collected At','Order','Payment Type','Amount','Receiving Cashier','Reference'],...payments.map(p=>[when(p.collected_at),String(p.order_id||'').slice(0,8),p.method,Number(p.amount),p.receiver,p.reference||''])];
 const xmlSheet=(name,values)=>'<Worksheet ss:Name="'+xmlEscape(name)+'"><Table>'+values.map(row=>'<Row>'+row.map(v=>{const isNumber=typeof v==='number'&&Number.isFinite(v);return '<Cell><Data ss:Type="'+(isNumber?'Number':'String')+'">'+xmlEscape(v)+'</Data></Cell>'}).join('')+'</Row>').join('')+'</Table></Worksheet>';
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+xmlSheet('Shift Items',items)+xmlSheet('Payments',collected)+'</Workbook>';
 downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel'}),'FinSight_Shift_'+String(S.selectedShift).slice(0,8)+'.xls');
}
function printShiftReport(){if(!S.shiftDetail)return;const d=S.shiftDetail,rows=reportRows(),payments=d.payments||[];
 const itemRows=rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.order)+'</td><td>'+esc(r.item)+'</td><td>'+Number(r.quantity)+'</td><td>'+money(r.gross)+'</td><td>'+money(r.discount||0)+'</td><td>'+money(r.net||0)+'</td><td>'+esc(r.payment)+'</td><td>'+esc(r.cashier)+'</td></tr>').join('');
 const payRows=payments.map(p=>'<tr><td>'+esc(when(p.collected_at))+'</td><td>'+esc(p.method)+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.receiver)+'</td><td>'+esc(p.reference||'')+'</td></tr>').join('');
 const body='<h2>Detailed Till Shift Report</h2><p>'+esc(d.company_name)+' · '+esc(d.outlet_name)+' · '+esc(d.business_date||localDay(d.opened_at))+'</p><h3>Itemized Sales</h3><table><thead><tr><th>Date</th><th>Order</th><th>Item</th><th>Qty</th><th>Gross</th><th>Discount</th><th>After Discount</th><th>Payment</th><th>Order Cashier</th></tr></thead><tbody>'+itemRows+'</tbody></table><h3>Collections by Receiving Cashier</h3><table><thead><tr><th>Date</th><th>Payment Method</th><th>Amount</th><th>Receiving Cashier</th><th>Reference</th></tr></thead><tbody>'+payRows+'</tbody></table><p>FinSight POS operational report; Accounting posting and fiscal documentation are separate processes.</p>';
 openPrintWindow('FinSight Shift Report',body,'A4 landscape');
}

function integrationCard(type,label,providers){
 const value=integrationChoice(type);
 const id=type==='eTIMS'?'etims':type==='M-Pesa'?'mpesa':'pdq';
 const providerOptions=providers.map(v=>`<option value="${esc(v)}" ${value?.provider===v?'selected':''}>${esc(v)}</option>`).join('');

async function convertPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPEG, PNG or WebP.');const img=await createImageBitmap(file);const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image processing unavailable.');ctx.drawImage(img,0,0,canvas.width,canvas.height);img.close?.();const blob=await new Promise((resolve,reject)=>canvas.toBlob(x=>x?resolve(x):reject(Error('Conversion failed.')),'image/jpeg',.83));if(blob.size>3145728)throw Error('Image exceeds 3 MB.');return blob}

async function submitCheckout(mode,payments){if(S.busy)return; if(!S.ws.shift_id)return show('Open Till Shift first.','error');
 if(!S.cart.length)return show('Select items first.','error');
 const due=checkoutTotals().net;if(due<0)return show('Discount exceeds gross sale.','error');
 if(mode==='Paid'){
  const sum=payments.reduce((acc,p)=>acc+Math.round(Number(p.amount)*100),0);
  if(payments.some(p=>!p.payment_type_id||!Number.isFinite(p.amount)||p.amount<=0)||sum!==Math.round(due*100))return show('Payment amounts must add up exactly to the amount due.','error');
 }
 S.busy=true;S.checkoutRequest=S.checkoutRequest||newUuid();
 try{
  const completed=await rpc('pos_checkout_atomic',checkoutPayload(mode,payments));
  S.checkoutDialog=false;S.checkoutMpesaManual=false;S.paymentRows=[];S.checkoutRequest=null;S.cart=[];S.orderNotes='';S.selectedRules=[];
  S.paymentOrder=null;
  try{await printCheckoutDocument(completed.order_id)}catch(printError){show('Checkout saved. Printing failed: '+printError.message,'error');return}
  show(mode==='Paid'?'Paid order sent to Kitchen.':'Guest Bill sent to Kitchen — unpaid.');
  void loadHistory().catch(e=>console.warn('History refresh:',e.message));
 }catch(e){show('Order not saved: '+e.message,'error')}
 finally{S.busy=false;}
}
function payAndPrint(){if(!S.checkoutDialog)return;const payments=readCheckoutPayments();if(payments.some(p=>isCheckoutMpesa(p.payment_type_id))&&!S.checkoutMpesaManual){return checkoutMpesaFeedback('For M-Pesa, use verified STK Push when connected, or tick manual confirmation after checking payment on your Till. The order has not been submitted.')}submitCheckout('Paid',payments)}
function checkoutGuestBill(){submitCheckout('Guest Bill',[])}

async function printReceiptInPage(title,receiptHtml,style,paper){
 if(document.getElementById('finsight-pos-print-root'))throw Error('A receipt is already being prepared for printing.');
 const width=paper==='58mm'?'58mm':paper==='80mm'?'80mm':'A4';
 const pageWidth=width==='A4'?'210mm':width;
 const receiptWidth=width==='58mm'?'52mm':width==='80mm'?'74mm':'200mm';
 const root=document.createElement('div');
 root.id='finsight-pos-print-root';root.setAttribute('aria-hidden','true');
 root.style.cssText='position:absolute;left:-10000px;top:0;width:'+pageWidth+';background:white;color:#111;pointer-events:none;';
 root.innerHTML=receiptHtml;
 const css=document.createElement('style');
 css.id='finsight-pos-print-style';
 css.textContent=`
 @media print {
  body > :not(#finsight-pos-print-root){display:none!important}
  html,body{width:${pageWidth}!important;min-width:0!important;max-width:${pageWidth}!important;margin:0!important;padding:0!important;background:white!important;color:#111!important}
  #finsight-pos-print-root{display:block!important;position:static!important;left:auto!important;top:auto!important;width:${pageWidth}!important;max-width:${pageWidth}!important;margin:0!important;padding:3mm!important;box-sizing:border-box!important;visibility:visible!important;pointer-events:auto!important}
  #finsight-pos-print-root .receipt-preview{width:${receiptWidth}!important;max-width:${receiptWidth}!important;margin:0 auto!important;padding:0!important;border:0!important;text-align:center!important;background:white!important;color:#111!important;font:11px/1.35 'Courier New',monospace!important;overflow-wrap:anywhere!important}
  #finsight-pos-print-root .receipt-preview img{max-width:80%!important;max-height:18mm!important;object-fit:contain}
  #finsight-pos-print-root .rline{display:flex!important;justify-content:space-between!important;gap:2mm!important;text-align:left!important;padding:1mm 0!important}
  #finsight-pos-print-root .rline span:first-child{flex:1;min-width:0}
  #finsight-pos-print-root .rline span:last-child{text-align:right;flex-shrink:0}
  #finsight-pos-print-root .hint{font-size:9px!important;color:#444!important}
  #finsight-pos-print-root hr{border:0!important;border-top:1px dashed #888!important;margin:2mm 0!important}
 }`;
 document.head.appendChild(css);document.body.appendChild(root);
 let timeout,cleaned=false;
 const onPrinted=()=>setTimeout(cleanup,350);
 const cleanup=()=>{if(cleaned)return;cleaned=true;clearTimeout(timeout);window.removeEventListener('afterprint',onPrinted);css.remove();root.remove()};
 try{
  timeout=setTimeout(cleanup,120000);
  try{await Promise.race([document.fonts.ready,new Promise(ok=>setTimeout(ok,1600))])}catch(_){}
  await Promise.all(Array.from(root.querySelectorAll('img')).map(im=>im.complete?Promise.resolve():new Promise(ok=>{im.onload=ok;im.onerror=ok;setTimeout(ok,1600)})));
  const contentPx=Math.max(root.scrollHeight,root.querySelector('.receipt-preview')?.scrollHeight||0);
  const heightMm=Math.max(45,Math.min(1500,Math.ceil(contentPx*25.4/96+9)));
  css.textContent+='@page{size:'+pageWidth+' '+heightMm+'mm;margin:0}';
  window.addEventListener('afterprint',onPrinted);
  window.print();
 }catch(error){cleanup();throw error}
}
async function printCheckoutDocument(id){
 const d=await rpc('pos_cashier_print_document',arg({p_order:id}));
 const t=d.template||{},paid=d.status==='Paid',paperMm=Number(t.paper_mm)===58?58:80;
 const header=paid?esc(t.receipt_heading||'RECEIPT'):'GUEST BILL — UNPAID';
 const logo=t.logo_path&&String(t.logo_path).startsWith(S.ws.company_id+'/receipt/')?S.db.storage.from('finsight-pos-menu').getPublicUrl(t.logo_path).data.publicUrl:null;
 const balance=Math.max(0,Number(d.total||0)-Number(d.paid||0));
 const html=`<div class="receipt-preview">${logo?`<img src="${esc(logo)}" alt="Company logo">`:''}<div><strong>${esc(d.company_name)}</strong></div><div>${esc(d.outlet_name)}</div><div>${esc(t.address_text||'')}</div><div>${esc(t.phone_text||'')}</div><hr><strong>${header}</strong><div>Order ${esc(formatOrderNumber(d.order_number))}</div><div>${esc(when(d.date))}</div><div>Cashier: ${esc(d.cashier)}</div>${d.table_name?`<div>Table: ${esc(d.table_name)}</div>`:''}<hr>
 ${(d.items||[]).map(x=>`<div class="rline"><span>${Number(x.quantity)} × ${esc(x.name)}</span><span>${money(x.total)}</span></div>${(x.modifiers||[]).map(m=>`<div class="hint">+ ${esc(m.name)}</div>`).join('')}`).join('')}
 <hr><div class="rline"><span>Before adjustments</span><span>${money(d.gross)}</span></div>${Number(d.discount)?`<div class="rline"><span>Discount</span><span>−${money(d.discount)}</span></div>`:''}${Number(d.surcharge)?`<div class="rline"><span>Surcharge</span><span>+${money(d.surcharge)}</span></div>`:''}
 <div class="rline"><strong>Total</strong><strong>${money(d.total)}</strong></div>${(d.payments||[]).map(x=>`<div class="rline"><span>${esc(x.method)}</span><span>${money(x.amount)}</span></div>`).join('')}
 ${!paid?`<div><strong>AMOUNT DUE: ${money(balance)}</strong></div>`:''}<hr><div>${esc(t.footer_text||'Thank you!')}</div><div class="hint">POS document • Fiscal invoice issued separately where required.</div></div>`;
 const paper=paperMm+'mm',printable=(paperMm-6)+'mm';
 // @page size: 80mm auto is INVALID. A two-length declaration is valid, with the height measured below.
 const style=`<style id="receipt-page-rule">@page{size:${paper} 180mm;margin:0}</style><style>
 html,body{margin:0;padding:0;width:${paper};max-width:${paper};background:#fff;color:#111}
 body{font:11px/1.35 'Courier New',monospace;box-sizing:border-box;padding:3mm}
 .receipt-preview{width:${printable};max-width:${printable};overflow-wrap:anywhere;text-align:center;margin:0 auto}
 .receipt-preview img{max-width:80%;max-height:18mm;object-fit:contain}
 .rline{display:flex;justify-content:space-between;gap:2mm;text-align:left;padding:1mm 0}
 .rline span:first-child{flex:1;min-width:0}.rline span:last-child{text-align:right;flex-shrink:0}
 .hint{font-size:9px;color:#444}hr{border:0;border-top:1px dashed #888;margin:2mm 0}
 @media print{html,body{margin:0!important;box-shadow:none!important}body{padding:3mm}}
 </style>`;
 await printReceiptInPage(header,html,style,paper);
}

 printCheckoutDocument(id).catch(e=>show('Printing failed: '+e.message,'error'));

function formatOrderNumber(n){return n==null?'—':String(n).padStart(3,'0')}
function history(){
 return `<div class="filters"><div class="field"><label>Order Date</label><input type="date" value="${esc(S.historyDate)}" onchange="historyDateChanged(this.value)"></div><div class="field"><label>Payment Status</label><select onchange="S.historyPaymentFilter=this.value;render()"><option value="All" ${S.historyPaymentFilter==='All'?'selected':''}>All</option><option value="Paid" ${S.historyPaymentFilter==='Paid'?'selected':''}>Paid</option><option value="Unpaid" ${S.historyPaymentFilter==='Unpaid'?'selected':''}>Unpaid</option></select></div>${b('All Dates',"historyDateChanged('')")}${b('Refresh',"go('history')")}</div>
 ${S.paymentOrder?paymentPanel():''}<div class="order-grid">${S.orders.filter(o=>S.historyPaymentFilter==='All'||(S.historyPaymentFilter==='Paid'?o.payment_status==='Paid':o.payment_status!=='Paid')).map(o=>`<div class="order-card"><div class="row"><strong>Order ${esc(formatOrderNumber(o.order_number))}</strong><span class="tag ${esc(o.kitchen_status)}">${esc(o.kitchen_status)}</span></div><div class="hint">${esc(when(o.created_at))} · ${esc(o.order_type)}</div><div class="payment-status ${o.payment_status==='Paid'?'paid':'unpaid'}">${o.payment_status==='Paid'?'Paid':o.checkout_kind==='Guest Bill'?'Guest Bill — Unpaid':'Unpaid'}</div><div style="margin:12px 0">${(o.pos_order_lines||[]).map(l=>`<div>${Number(l.quantity)} × ${esc(l.name_snapshot)}</div>`).join('')}</div><div class="row"><strong>${money(o.total)}</strong><div class="actions">${o.payment_status!=='Paid'&&['Guest Bill','Legacy'].includes(o.checkout_kind)?b('Take Payment',`openPayment('${esc(o.id)}')`,'primary small'):''}${b(o.payment_status==='Paid'?'Reprint Receipt':'Print Guest Bill',`reprintOrder('${esc(o.id)}')`,'small')}</div></div></div>`).join('')||'<div class="card">No orders found.</div>'}</div>`
}
async function openPayment(id){
 try{
  const selected=S.orders.find(o=>o.id===id);
  if(!selected||!['Guest Bill','Legacy'].includes(selected.checkout_kind))throw Error('Only Guest Bills can be paid from Order History.');
  S.paymentOrder=id;
  const [balance,methods]=await Promise.all([
   rpc('pos_cashier_order_balance',arg({p_order:id})),

  ]);
  S.paymentBalance=balance;S.paymentMethods=methods||[];S.paymentRequest=null;S.mpesaIntentId=null;S.mpesaOrder=id;S.mpesaMessage='';S.mpesaRequestId=null;clearTimeout(S.mpesaTimer);render();
 }catch(e){S.paymentOrder=null;show('Cannot load payment: '+e.message,'error')}

 const d=S.paymentBalance||{},remaining=Math.max(0,Number(d.total||0)-Number(d.confirmed||0));
 return `<div class="card" style="margin-bottom:16px;border:2px solid var(--accent)">
 <div class="row"><h3>Collect Payment · ${esc(formatOrderNumber(S.orders.find(x=>x.id===S.paymentOrder)?.order_number))}</h3>${b('Close',"S.paymentOrder=null;render()")}</div>
 <div class="row"><span>Order Total</span><strong>${money(d.total)}</strong></div>

 <div class="field"><label>Payment Type</label><select id="payMethod">${S.paymentMethods.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Amount</label><input id="payAmount" type="number" min="0.01" step="0.01" max="${remaining}" value="${remaining.toFixed(2)}"></div></div>

async function recordPayment(printAfter=false){
 if(!S.paymentOrder||S.busy)return;
 const orderId=S.paymentOrder,method=document.getElementById('payMethod')?.value,
 amount=Number(document.getElementById('payAmount')?.value),ref=document.getElementById('payRef')?.value.trim()||null;
 const remaining=Number(S.paymentBalance.total)-Number(S.paymentBalance.confirmed);
 if(!method||!Number.isFinite(amount)||amount<=0||Math.round(amount*100)>Math.round(remaining*100)||Math.abs(Math.round(amount*100)-amount*100)>0.001)
 return show('Enter an amount not exceeding the balance.','error');
 if(printAfter&&Math.round(amount*100)!==Math.round(remaining*100))return show('Pay the full remaining balance to print a final receipt. Record partial payments separately.','error');
 S.busy=true;S.paymentRequest=S.paymentRequest||newUuid();
 try{await rpc('pos_cashier_record_payment',arg({p_order:orderId,p_method:method,p_amount:amount,p_request:S.paymentRequest,p_reference:ref}));
 S.paymentRequest=null;S.paymentBalance=await rpc('pos_cashier_order_balance',arg({p_order:orderId}));await loadHistory();
 if(printAfter){try{await printCheckoutDocument(orderId)}catch(e){show('Payment saved, but printing failed: '+e.message,'error');return}}
 show('Payment recorded'+(printAfter?' and receipt sent to printer.':'.'));}
 catch(e){show('Payment not recorded: '+e.message,'error')}
 finally{S.busy=false}
}
async function historyDateChanged(date){S.historyDate=date;try{await loadHistory();render()}catch(e){show(e.message,'error')}}
function tables(){return `<div class="row" style="margin-bottom:15px"><span class="hint">Tables are Empty after Kitchen marks the order Served.</span>${b('Refresh',"go('tables')")}</div><div class="tablegrid">${S.tables.map(t=>`<div class="table-tile ${t.occupied?'occupied':''}"><div style="font-size:31px">🍽️</div><strong>${esc(t.name)}</strong><p class="tag">${t.occupied?'Occupied':'Empty'}</p></div>`).join('')||'<div class="card">No restaurant tables configured.</div>'}</div>`}
function kitchen(){const orders=S.orders.filter(x=>S.prepFilter==='served'?x.kitchen_status==='Served':x.status==='Open'&&x.kitchen_status!=='Served');return `<div class="actions" style="margin-bottom:16px">${b('Active Orders',"S.prepFilter='active';render()",S.prepFilter==='active'?'primary':'')}${b('Served',"S.prepFilter='served';render()",S.prepFilter==='served'?'primary':'')}${b('Refresh',"go('kitchen')")}</div><div class="order-grid">${orders.map(o=>{const longest=Math.max(0,...(o.items||[]).map(l=>Number(l.preparation_minutes??10)));return `<div class="order-card"><div class="row"><strong>Order ${esc(formatOrderNumber(o.order_number))}</strong><span class="tag ${esc(o.kitchen_status)}">${esc(o.kitchen_status)}</span></div><div class="hint">${esc(o.table||o.order_type)} · ${esc(when(o.created_at))}</div>${['New','Preparing'].includes(o.kitchen_status)?`<div class="countdown" data-kitchen-start="${esc(o.created_at)}" data-kitchen-duration="${longest}">--:--</div>`:''}<div style="margin:14px 0">${(o.items||[]).map(l=>`<div class="cart-line"><strong>${Number(l.quantity)} × ${esc(l.name_snapshot)}</strong><div class="hint">Preparation: ${Number(l.preparation_minutes??10)} min ${l.instructions?'· '+esc(l.instructions):''}</div></div>`).join('')}</div>${o.kitchen_status==='New'?b('Start Preparing',`kitchenNext('${esc(o.id)}','Preparing')`,'primary wide'):o.kitchen_status==='Preparing'?b('Mark Ready',`kitchenNext('${esc(o.id)}','Ready')`,'primary wide'):o.kitchen_status==='Ready'?b('Mark Served',`kitchenNext('${esc(o.id)}','Served')`,'primary wide'):''}</div>`}).join('')||'<div class="card">No orders in this view.</div>'}</div>`}
function updateKitchenTimers(){if(S.role!=='Kitchen'||S.page!=='kitchen')return;document.querySelectorAll('[data-kitchen-start]').forEach(el=>{const start=Date.parse(el.dataset.kitchenStart||'');const duration=Number(el.dataset.kitchenDuration||0);if(!Number.isFinite(start)||!Number.isFinite(duration))return;const remaining=Math.ceil((start+duration*60000-Date.now())/1000);const magnitude=Math.abs(remaining);el.textContent=(remaining<0?'−':'')+String(Math.floor(magnitude/60)).padStart(2,'0')+':'+String(magnitude%60).padStart(2,'0');el.classList.toggle('overdue',remaining<0)})}
const kitchenUpdatesInFlight=new Map();
async function kitchenNext(id,status){
 if(kitchenUpdatesInFlight.has(id))return;
 const order=S.orders.find(o=>o.id===id);if(!order)return;
 const previous=order.kitchen_status;
 const valid=(previous==='New'&&status==='Preparing')||(previous==='Preparing'&&status==='Ready')||(previous==='Ready'&&status==='Served');
 if(!valid)return show('The Kitchen status has changed. Refresh the order.','error');
 kitchenUpdatesInFlight.set(id,status);
 order.kitchen_status=status;render(); // Instant visual response, but NOT yet confirmed as saved.
 try{
  await rpc('pos_employee_kitchen_status',arg({p_order:id,p_status:status}));
  kitchenUpdatesInFlight.delete(id);
  // No blocking refetch before the cashier/kitchen can continue.
  show('Order marked '+status+'.');
  void loadKitchen().then(()=>{if(S.role==='Kitchen'&&S.page==='kitchen')render()}).catch(e=>console.warn('Kitchen refresh:',e.message));
 }catch(e){
  kitchenUpdatesInFlight.delete(id);
  const current=S.orders.find(o=>o.id===id);if(current)current.kitchen_status=previous;
  show('Not saved: '+e.message,'error');
 }
}
// Load Supabase without blocking HTML rendering. Every failure leaves a visible recovery screen.
function startupScreen(message, retry=false){
 root.innerHTML='<div class="modalwrap"><div class="authpanel"><div class="brand"><span class="mark">F</span> FinSight POS</div><h2>'+esc(retry?'Connection problem':'Starting FinSight POS')+'</h2><p>'+esc(message)+'</p>'+(retry?'<button type="button" class="btn primary wide" onclick="start()">Try Again</button>':'')+'</div></div>';
}
function loadLibrary(url,timeoutMs=6500){return new Promise((resolve,reject)=>{
 const script=document.createElement('script');let done=false;
 const timer=setTimeout(()=>finish(new Error('Supabase script timed out')),timeoutMs);
 function finish(err){if(done)return;done=true;clearTimeout(timer);script.onload=null;script.onerror=null;if(err){script.remove();reject(err)}else resolve()}
 script.src=url;script.async=true;script.onload=()=>finish();script.onerror=()=>finish(new Error('Could not load '+url));document.head.appendChild(script);
})}
async function timeoutPromise(promise,ms){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Connection is taking too long. Check your internet and retry.')),ms))])}
let kitchenTicker=null;
let starting=false;
async function start(){
 if(starting)return;starting=true;
 startupScreen('Connecting to FinSight…');
 try{
   if(!window.supabase?.createClient){
     let failure;
     for(const url of [
       'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js',
       'https://unpkg.com/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js'
     ]){try{await loadLibrary(url);if(window.supabase?.createClient)break}catch(e){failure=e}}
     if(!window.supabase?.createClient)throw new Error('Unable to load the Supabase sign-in library. Check your internet connection or try opening this HTML through a local server. '+(failure?.message||''));
   }
   if(!kitchenTicker)kitchenTicker=setInterval(updateKitchenTimers,1000);
   if(!S.db)S.db=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
   startupScreen('Checking your existing sign-in…');
   const result=await timeoutPromise(S.db.auth.getSession(),8000);
   if(result.error)throw result.error;
   if(result.data?.session?.user)await timeoutPromise(connectCompany(result.data.session),12000);
   else render();
 }catch(e){console.error('FinSight POS startup:',e);startupScreen(e?.message||'Unable to start FinSight POS.',true)}
 finally{starting=false}
}
window.addEventListener('error',e=>{if(!root?.innerHTML?.trim()){startupScreen('Startup error: '+(e.message||'Unknown error'),true)}});
window.addEventListener('unhandledrejection',e=>{console.error('FinSight POS asynchronous error',e.reason);if(!root?.innerHTML?.trim())startupScreen('Connection error: '+(e.reason?.message||'Unknown error'),true)});
start();
